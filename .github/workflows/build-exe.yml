name: Build Windows EXE

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，用于提取版本号

      - name: 提取版本号
        id: version
        shell: bash
        run: |
          # 从 content-1.html 提取版本号，格式: 3.13.1
          VER=$(grep -oP 'versionNumber">\K[0-9.]+' web/panels/content-1.html | head -1)
          if [ -z "$VER" ]; then
            VER=$(grep -oP 'V\K[0-9.]+' web/panels/nav.html | head -1)
          fi
          if [ -z "$VER" ]; then
            VER=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          fi
          if [ -z "$VER" ]; then
            VER="0.0.0"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "版本号: v$VER"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 升级 pip
        run: |
          python -m pip install --upgrade pip

      - name: 安装 Windows 系统依赖
        run: |
          # pythonnet 是 pywebview 在 Windows 上的必需依赖
          pip install pythonnet --only-binary :all:
        continue-on-error: true

      - name: 安装 Python 依赖
        run: |
          pip install pyinstaller pillow chardet capstone bottle proxy-tools pytest
          # 单独安装 pywebview，让它自动处理平台依赖
          pip install pywebview==4.0

      - name: 环境诊断
        shell: bash
        run: |
          echo "=== Python 版本 ==="
          python --version
          echo "=== 已安装包 ==="
          pip list 2>/dev/null | grep -iE "pywebview|pythonnet|pillow|pyinstaller|pytest"
          echo "=== Node.js ==="
          node --version 2>/dev/null || echo "Node.js 未安装"
          echo "=== 工作目录 ==="
          pwd && ls -la

      - name: 完整性验证
        shell: bash
        run: |
          echo "运行语法验证..."
          python validate.py --quick
          if [ $? -ne 0 ]; then
            echo "::warning::验证未通过，但继续构建..."
          fi

      - name: 运行测试
        shell: bash
        run: |
          echo "运行测试..."
          python -m pytest tests/ -v --tb=short 2>&1 || echo "::warning::部分测试失败，继续构建..."
        continue-on-error: true

      - name: 编译 EXE
        run: |
          python -m PyInstaller build.spec --noconfirm

      - name: 验证产物
        shell: bash
        run: |
          if [ -f "dist/San7ModMaker.exe" ]; then
            echo "✓ EXE 编译成功: dist/San7ModMaker.exe"
            ls -lh dist/San7ModMaker.exe
          else
            echo "::error::EXE 编译失败，产物不存在"
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: San7ModMaker-v${{ steps.version.outputs.version }}
          path: dist/San7ModMaker.exe

      - name: 发布版本 Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/San7ModMaker.exe"
          tag: v${{ steps.version.outputs.version }}
          name: "San7ModMaker v${{ steps.version.outputs.version }}"
          body: |
            ## San7ModMaker v${{ steps.version.outputs.version }}

            **提交**: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **提交时间**: ${{ github.event.head_commit.timestamp }}

            > 下载 `San7ModMaker.exe` 即可使用。完整更新日志见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)。
          makeLatest: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          skipIfReleaseExists: false