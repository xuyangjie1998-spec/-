name: Build Windows EXE

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取版本号
        id: version
        shell: bash
        run: |
          VER=$(grep -oP 'versionNumber">\K[0-9.]+' web/panels/content-1.html | head -1)
          if [ -z "$VER" ]; then
            VER=$(grep -oP 'V\K[0-9.]+' web/panels/nav.html | head -1)
          fi
          if [ -z "$VER" ]; then
            VER=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          fi
          if [ -z "$VER" ]; then
            VER="0.0.0"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "版本号: v$VER"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          # 核心依赖（跨平台纯 Python 包）
          pip install pillow chardet bottle proxy-tools pytest pyinstaller
          # capstone 可能需要编译，使用 --only-binary 优先
          pip install capstone --only-binary :all: 2>/dev/null || pip install capstone
          # pywebview 在 Windows 上需要 pythonnet
          pip install pythonnet --only-binary :all: 2>/dev/null || echo "pythonnet 安装失败，尝试继续..."
          pip install pywebview==4.0 2>/dev/null || pip install "pywebview>=4.0,<6.0" 2>/dev/null || echo "::warning::pywebview 安装失败"

      - name: 环境诊断
        shell: bash
        run: |
          echo "=== Python ===" && python --version
          echo "=== pip 包 ===" && pip list 2>/dev/null | grep -iE "pywebview|pythonnet|pillow|pyinstaller|pytest|capstone"
          echo "=== Node.js ===" && node --version 2>/dev/null || echo "无 Node.js"
          echo "=== 目录 ===" && ls -la

      - name: 完整性验证
        shell: bash
        run: |
          python validate.py --quick || echo "::warning::验证未通过，继续构建..."

      - name: 运行测试
        shell: bash
        run: |
          python -m pytest tests/ -v --tb=short 2>&1 || echo "::warning::测试未全部通过"
        continue-on-error: true

      - name: 编译 EXE
        shell: bash
        run: |
          python -m PyInstaller build.spec --noconfirm

      - name: 验证产物
        shell: bash
        run: |
          if [ -f "dist/San7ModMaker.exe" ]; then
            echo "✓ EXE 编译成功: dist/San7ModMaker.exe"
            ls -lh dist/San7ModMaker.exe
          else
            echo "::error::EXE 不存在，编译失败"
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: San7ModMaker-v${{ steps.version.outputs.version }}
          path: dist/San7ModMaker.exe

      - name: 发布版本 Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/San7ModMaker.exe"
          tag: v${{ steps.version.outputs.version }}
          name: "San7ModMaker v${{ steps.version.outputs.version }}"
          body: |
            ## San7ModMaker v${{ steps.version.outputs.version }}

            **提交**: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **提交时间**: ${{ github.event.head_commit.timestamp }}

            > 下载 `San7ModMaker.exe` 即可使用。完整更新日志见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)。
          makeLatest: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          skipIfReleaseExists: false