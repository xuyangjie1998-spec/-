<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San7ModMaker 前端测试</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { color: #00d4ff; margin-bottom: 16px; font-size: 24px; }
.test-results { background: #16213e; border-radius: 8px; padding: 20px; margin-top: 16px; }
.test-summary { display: flex; gap: 20px; margin: 12px 0; font-size: 16px; }
.test-passed { color: #4caf50; }
.test-failed { color: #f44336; }
.test-total { color: #90caf9; }
.test-errors { margin-top: 16px; }
.test-errors h3 { color: #f44336; margin-bottom: 8px; }
.test-errors li { margin: 8px 0; padding: 8px; background: #1a1a2e; border-radius: 4px; }
.test-errors pre { color: #ff9800; margin-top: 4px; white-space: pre-wrap; word-break: break-all; }
#toastContainer { position: fixed; top: 10px; right: 10px; z-index: 9999; }
.toast { padding: 10px 16px; margin: 4px; border-radius: 4px; font-size: 14px; animation: fadeIn 0.3s; }
.toast-success { background: #4caf50; color: #fff; }
.toast-error { background: #f44336; color: #fff; }
.toast-warning { background: #ff9800; color: #fff; }
.toast-info { background: #2196f3; color: #fff; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<h1>🧪 San7ModMaker 前端单元测试</h1>
<div id="testOutput"></div>
<div id="toastContainer"></div>

<!-- 加载被测模块 -->
<script src="../js/core.js"></script>
<!-- 加载测试运行器 -->
<script src="test-runner.js"></script>
<!-- 加载测试用例 -->
<script src="test-core.js"></script>
</body>
</html>
