<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="color-scheme" content="dark">
    <title>San7ModMaker - 三国群英传7 MOD制作器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 左侧导航 (动态加载 panels/nav.html) -->
        <div id="navContainer"></div>

        <!-- 主内容区 (动态加载 panels/content-*.html) -->
        <main class="main-content" id="mainContent"></main>
    </div>

    <!-- JS 模块化加载 (从 app.js 拆分，保持原始顺序；defer 避免阻塞 HTML 解析) -->
    <script src="js/core.js" defer></script>
    <script src="js/panels-1.js" defer></script>
    <script src="js/panels-2.js" defer></script>
    <script src="js/panels-3.js" defer></script>
    <script src="js/panels-4.js" defer></script>

    <!-- HTML 模板加载器 -->
    <script>
    (function() {
        var loaded = 0, total = 3;
        var navEl = document.getElementById('navContainer');
        var mainEl = document.getElementById('mainContent');

        function checkDone() {
            loaded++;
            if (loaded === total) {
                // 所有模板加载完成后，分发 panelsLoaded 事件
                document.dispatchEvent(new Event('panelsLoaded'));
            }
        }

        // 加载导航
        fetch('panels/nav.html').then(function(r) { return r.text(); }).then(function(html) {
            navEl.innerHTML = html;
            checkDone();
        }).catch(function() { checkDone(); });

        // 加载内容面板
        fetch('panels/content-1.html').then(function(r) { return r.text(); }).then(function(html) {
            mainEl.insertAdjacentHTML('beforeend', html);
            checkDone();
        }).catch(function() { checkDone(); });

        fetch('panels/content-2.html').then(function(r) { return r.text(); }).then(function(html) {
            mainEl.insertAdjacentHTML('beforeend', html);
            checkDone();
        }).catch(function() { checkDone(); });
    })();
    </script>
</body>
</html>
